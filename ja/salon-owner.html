{\"name\":\"BuzzNet\",\"description\":\"SNSの無料診断を受ける\"},\"onlineStudio\":{\"name\":\"オンラインサロン\",\"description\":\"自分のオンラインサロンを開設\"},\"servicesLabel\":\"サービス\",\"menuLabel\":\"メニュー\",\"homeMenu\":{\"howItWorks\":\"利用方法\",\"testimonials\":\"お客様の声\",\"faq\":\"よくある質問\"},\"sections\":{\"features\":\"機能\",\"beforeAfter\":\"ビフォーアフター\",\"testimonials\":\"お客様の声\",\"getStarted\":\"はじめる\"},\"serviceMenu\":{\"howItWorks\":\"利用方法\",\"testimonials\":\"お客様の声\",\"beforeAfter\":\"導入前後の比較\"}}},\"home\":{\"nav\":{\"services\":\"サービス紹介\",\"why\":\"選ばれる理由\",\"stories\":\"成功事例\",\"getStarted\":\"始め方\",\"faq\":\"FAQ\",\"logIn\":\"ログイン\",\"signUp\":\"無料で登録\"},\"hero\":{\"badge\":\"仲間・専門家・AIによる継続支援プラットフォーム\",\"titleLine1\":\"人は一人では、\",\"titleLine2\":\"続けられない。\",\"description\":\"副業・SNS発信・コンテンツ制作。難しくはない、でも多くの人が一人だから途中でやめてしまう。仲間・専門家・AIが継続を支援する3つの仕組みで、学びと実践を続けられる環境をつくります。\",\"getStartedCta\":\"無料で登録する\",\"logInCta\":\"ログインはこちら\",\"trustLine\":\"✓ 登録は最短5分・完全無料スタート\",\"goalLabel\":\"目的から選ぶ\",\"goals\":{\"guild\":{\"title\":\"仲間と学ぶ（ギルド）\",\"description\":\"同じ目標の仲間と継続しやすく\"},\"buzznet\":{\"title\":\"AIと発信する（BuzzNet）\",\"description\":\"AIが発信を支援、継続をサポート\"},\"joinStudio\":{\"title\":\"サロンに入会する\",\"description\":\"クリエイター・専門家から直接学ぶ\"},\"openStudio\":{\"title\":\"サロンを開設する\",\"description\":\"あなたの知識をサロンで収益化\"},\"advertise\":{\"title\":\"広告を出す\",\"description\":\"ターゲットに届く効果的なプロモーション\"}},\"stats\":{\"countries\":\"28カ国\",\"countriesLabel\":\"世界へリーチ\",\"members\":\"約2万人\",\"membersLabel\":\"ギルド参加者\",\"revenue\":\"¥2,000万\",\"revenueLabel\":\"1週間の売上\",\"learningProgram\":\"学習プログラム\",\"learningProgramDetail\":\"4,000人が参加中 +12\"}},\"video\":{\"label\":\"Buzzencer紹介動画\"},\"services\":{\"eyebrow\":\"SERVICES\",\"title\":\"3つの仕組みで、\",\"titleHighlight\":\"学びを続けられる\",\"titleEnd\":\"環境をつくる\",\"description\":\"仲間・専門家・AIの力を組み合わせることで、一人では続かない挑戦も継続できます。\",\"guild\":{\"name\":\"Guild\",\"tagline\":\"ギルド — 仲間と学ぶ\",\"description\":\"同じ目標を持つ仲間とチームを組み、共に課題に挑みます。相互支援が継続の鍵です。\",\"cta\":\"詳しく見る\"},\"onlineSalon\":{\"name\":\"Online Salon\",\"tagline\":\"オンラインサロン — 専門家から学ぶ\",\"description\":\"トップクリエイターや専門家から直接フィードバックを受けられるプレミアム環境です。\",\"cta\":\"詳しく見る\"},\"buzznet\":{\"name\":\"BuzzNet\",\"tagline\":\"AIと学び、発信する\",\"description\":\"AIがあなたの発信を分析し、最適な継続プランとコンテンツ作成をサポートします。\",\"cta\":\"詳しく見る\"}},\"why\":{\"eyebrow\":\"ADVANTAGE\",\"title\":\"なぜ、人は\",\"titleHighlight\":\"続けられない\",\"titleEnd\":\"のか。\",\"showMore\":\"もっと見る\",\"seeMore\":\"さらに見る（あと3件）\",\"close\":\"閉じる\",\"items\":{\"reason01\":{\"tag\":\"REASON 01\",\"title\":\"「一人だから」やめてしまう\",\"description\":\"意志の力だけで続けられる人はわずかです。人間は本来、他人の目や励ましがない環境では、つい楽な方へ流されてしまう生き物だからです。\"},\"reason02\":{\"tag\":\"REASON 02\",\"title\":\"仲間がいると続けられる\",\"description\":\"共通の目的を持つ仲間と進捗を共有。サボれない環境が自然に生まれます。\"},\"reason03\":{\"tag\":\"REASON 03\",\"title\":\"専門家から正しく学ぶ\",\"description\":\"迷いは挫折の元。正しい道筋を知る専門家が伴走することで安心感が生まれます。\"},\"reason04\":{\"tag\":\"REASON 04\",\"title\":\"AIが発信を継続支援\",\"description\":\"ネタ切れやモチベーションの波をAIが察知。最適な提案でサポートします。\"},\"reason05\":{\"tag\":\"REASON 05\",\"title\":\"学ぶ → 実践 → 発信 → 教える\",\"description\":\"今の参加者が将来はギルドリーダーやクリエイターになる。その循環がBuzzencerの目指すコミュニティの姿です。\"},\"result01\":{\"tag\":\"RESULT 01\",\"title\":\"約20%が1週間で学習へ移行\",\"description\":\"約2万人のコミュニティから、約4,000人が1週間で学習プログラムへ参加。継続支援モデルが機能し始めた結果です\"},\"result02\":{\"tag\":\"RESULT 02\",\"title\":\"開設1週間で約2,000万円の売上\",\"description\":\"数字そのものより、「学びたい・成長したい」と考える人がこれだけ存在していたことに大きな価値があると考えています。\"},\"vision\":{\"tag\":\"VISION\",\"title\":\"人生を豊かにする継続支援\",\"description\":\"私たちはアフィリエイト会社でも、サロン会社でも、AIツール会社でもありません。人が挑戦を続けられる環境を作り、人生を豊かにする会社です。\"}}},\"stories\":{\"eyebrow\":\"SUCCESS STORIES\",\"title\":\"学んだ人が、\",\"titleHighlight\":\"次の人を導くリーダーになった。\",\"items\":{\"story01\":{\"tag\":\"SUCCESS STORY 01\",\"quote\":\"一人では3度挫折。仲間がいたら、続けられた。\",\"description\":\"副業を3度諦めてきたが、Guildで「正しい環境がなかっただけ」と気づいた。同じ目標を持つ仲間との情報交換・励まし合いが継続の力になり、今はコミュニティリーダーとして同じ挫折経験者に希望を届けている。\",\"name\":\"27歳 / 会社員\",\"role\":\"ギルドリーダー\",\"outcome\":\"継続\",\"outcomeDetail\":\"3度の挫折を乗り越えた\"},\"story02\":{\"tag\":\"SUCCESS STORY 02\",\"quote\":\"サロンで学んだことが、自分の発信の武器になった。\",\"description\":\"育児の合間に学びを始め、BuzzStudioの専門家サロンで実践的なノウハウを習得。「学ぶだけ」で終わらず、BuzzNetのAI支援で発信を継続。今は同世代の主婦たちへ「あなたにもできる」を伝える発信者になった。\",\"name\":\"38歳 / 主婦\",\"role\":\"発信者 / サロン参加者\",\"outcome\":\"成長\",\"outcomeDetail\":\"学ぶ → 実践 → 発信へ\"},\"story03\":{\"tag\":\"SUCCESS STORY 03\",\"quote\":\"20年のキャリアを、次の世代へ教えることで輝かせた。\",\"description\":\"「自分の経験なんて誰も聞かない」と思っていたが、BuzzStudioでサロンを開設。Guildのコミュニティ内でノウハウを共有するうちに参加者が成長し、今は自らが「教える側」として新しい参加者を導くリーダーになった。\",\"name\":\"45歳 / 会社員\",\"role\":\"サロンオーナー / ギルドリーダー\",\"outcome\":\"循環\",\"outcomeDetail\":\"学ぶ → 教えるへの進化\"}}},\"steps\":{\"eyebrow\":\"EASY START\",\"title\":\"はじめるには、たった3ステップ。\",\"description\":\"登録はぜんぶ無料。最短5分で、最初のクエストに挑めます。\",\"items\":{\"step1\":{\"title\":\"無料で登録\",\"description\":\"まずはメールアドレスかSNS連携でアカウントを作成します。\"},\"step2\":{\"title\":\"サービスを選ぶ\",\"description\":\"ギルド、サロン、AI発信支援。あなたの目的に合ったツールを選びます。\"},\"step3\":{\"title\":\"発信して稼ぐ\",\"description\":\"仲間や専門家と共に活動を開始。学びを収益化する仕組みも用意されています。\"}}},\"faq\":{\"eyebrow\":\"FAQ\",\"title\":\"よくある質問\",\"items\":{\"q1\":{\"question\":\"Buzzencerはどんなプラットフォームですか？\",\"answer\":\"「人は一人では続かない」という課題を解決する継続支援プラットフォームです。ギルド（仲間）・オンラインサロン（専門家）・BuzzNet（AI）の3つを組み合わせることで、学びと実践を継続できる環境を提供しています。\"},\"q2\":{\"question\":\"登録に費用はかかりますか？\",\"answer\":\"はい。登録は完全無料で、約5分で最初のクエストをスタートできます。\"},\"q3\":{\"question\":\"ギルドとは何ですか？\",\"answer\":\"ギルドとは、同じ目標を持つ仲間が集まるグループです。メンバー同士で情報交換をしたり励まし合ったりしながら、継続をサポートし合います。\"},\"q4\":{\"question\":\"BuzzStudio（オンラインサロン）とは？\",\"answer\":\"BuzzStudioは、クリエイターや専門家が実践的で裏付けのあるノウハウを参加者と共有するオンラインサロンです。\"},\"q5\":{\"question\":\"BuzzNetのAI機能はどんなことができますか？\",\"answer\":\"BuzzNetのAIは、SNS投稿の作成と継続的な発信をサポートします。「何を書けばいいか分からない」と悩む必要はもうありません。\"}}},\"finalCta\":{\"title\":\"今日から、\",\"titleHighlight\":\"学びを続ける\",\"titleEnd\":\"仲間と出会おう。\",\"description\":\"一人では続かなかった挑戦も、仲間・専門家・AIのサポートで続けられます。\",\"trustLine\":\"登録無料・最短5分。\",\"getStartedCta\":\"無料で登録する\",\"exploreCta\":\"サービスを詳しく見る\"},\"footer\":{\"guild\":\"Guild\",\"onlineStudio\":\"Online Studio\",\"buzzn
